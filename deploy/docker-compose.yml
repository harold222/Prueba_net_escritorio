services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${IPS_SQL_PASSWORD:?Set IPS_SQL_PASSWORD before starting SQL Server}
    ports: ["127.0.0.1:1433:1433"]
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  sqlserver-data:
